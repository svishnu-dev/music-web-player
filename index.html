<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="player">

        <h1>Music Player</h1>

        <img
            class="album-cover"
            src="images/treat-you-better.png"
            alt="Album Cover"
        >

        <div class="song-info">
            <h2>Treat You Better</h2>
            <p>Shawn Mendes</p>
        </div>


        <!-- Lyrics -->
        <div class="lyrics">
            <div id="lyrics-track"></div>
        </div>


        <div class="controls">

            <div class="progress-container">

                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

            </div>


            <button id="playBtn">
                <span class="play-icon">▶</span>
            </button>

        </div>


        <audio
            id="music"
            src="audio/shawn_mendes_-_treat_you_better_-_shawn_mendes_-_treat_you_better_(mp3.pm).mp3"
            loop>
        </audio>

    </div>


    <script src="script.js"></script>

</body>

</html>
